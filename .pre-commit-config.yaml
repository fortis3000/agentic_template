fail_fast: true
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff Check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ty-check
        name: Ty Type Check
        entry: uv run ty check
        language: system
        types: [python]
      - id: bandit
        name: Bandit Security Check
        entry: uv run bandit -c pyproject.toml
        language: system
        types: [python]
      - id: pymarkdown
        name: Pymarkdown Scan
        entry: uv run pymarkdown --enable-extensions front-matter --disable-rules MD007,MD012,MD013,MD022,MD024,MD029,MD031,MD032,MD033,MD041,MD046 scan
        language: system
        types: [markdown]
      - id: sqlfluff-fix
        name: SQLFluff Fix
        entry: uv run sqlfluff fix --force
        language: system
        types: [sql]
      - id: sqlfluff-lint
        name: SQLFluff Lint
        entry: uv run sqlfluff lint
        language: system
        types: [sql]
      - id: pytest
        name: Pytest Suite
        entry: uv run python -m pytest -v
        language: system
        pass_filenames: false
        always_run: true
      - id: semgrep
        name: Semgrep Scan
        entry: uv run semgrep scan --config .semgrep/rules.yaml --error
        language: system
        types: [python]
      - id: check-commit-message
        name: Check Commit Message
        entry: bash .agents/scripts/validate_commit_message.sh
        language: system
        stages: [commit-msg]
      - id: yamllint
        name: Yamllint Scan
        entry: uv run yamllint .
        language: system
        files: \.(yaml|yml)$
        pass_filenames: false
      - id: frontend-lint
        name: Frontend Lint & Type Check (Svelte)
        entry: bash -c "cd frontend && [ -d node_modules ] || npm install; npm run lint"
        language: system
        files: ^frontend/src/.*\.(js|ts|tsx|svelte)$
        pass_filenames: false
      - id: frontend-format
        name: Frontend Format (Prettier)
        entry: bash -c "cd frontend && [ -d node_modules ] || npm install; npm run format:check"
        language: system
        files: ^frontend/src/.*\.(js|ts|tsx|css|html|svelte)$
        pass_filenames: false
