agent:
  name: "demo_agent"
  model: "gemini-3.5-flash-lite"
  provider: "google"
  system_prompt_path: "src/prompts/system_prompt.txt"
  user_prompt_path: "src/prompts/user_prompt.txt"
  app_data_dir: "data"
  streaming: false
  retry:
    attempts: 3
    delay: 5
  acceptable_data_types:
    - "image/png"
    - "image/jpeg"
    - "image/gif"
  max_image_width: 1024
  max_image_height: 1024
  min_image_width: 128
  min_image_height: 128
  acceptable_file_types:
    - "application/pdf"
    - "text/plain"
    - "text/markdown"
    - "text/html"
  max_file_size_bytes: 20971520  # 20 MB
  max_files_per_message: 5
  tools:
    - "search_vectordb"
    - "get_weather"

phoenix:
  enabled: true
  project_name: "agentic-template"
  collector_endpoint: "http://localhost:6006/v1/traces"
  host: "localhost"
  port: 6006
  auto_instrument: true
