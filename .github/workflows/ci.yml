name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, edited]
env:
  PYTHON_VERSION: "3.13"

jobs:
  validate_commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Commit Messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.event.pull_request.base.ref }}
            COMMITS=$(git log --format="%H" origin/${{ github.event.pull_request.base.ref }}..HEAD)
          else
            COMMITS=$(git log --format="%H" -n 1 HEAD)
          fi

          for commit in $COMMITS; do
            subject=$(git log --format="%s" -n 1 "$commit")
            echo "Validating commit: $subject"
            echo "$subject" | bash .agents/scripts/validate_commit_message.sh
          done

  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Installing Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --extra all

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run type checking
        run: uvx ty check .

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

  pr_description_lint:
    name: Lint PR Description
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Installing Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate PR Description
        run: uv run python src/utils/pr_validator.py

  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Installing Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests with pytest and coverage
        run: |
          set +e
          uv run coverage run -m pytest -v .
          PYTEST_EXIT_CODE=$?
          set -e
          if [ $PYTEST_EXIT_CODE -eq 0 ]; then
            uv run coverage report -m --fail-under=80
          elif [ $PYTEST_EXIT_CODE -eq 5 ]; then
            echo "No tests found. Skipping coverage report."
          else
            exit $PYTEST_EXIT_CODE
          fi

  build_docker_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sample Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
