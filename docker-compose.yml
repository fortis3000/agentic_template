services:
  agent-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: agentic-template:latest
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PHOENIX_CLIENT_HEADERS=api_key=${PHOENIX_API_KEY:-}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    env_file:
      - .env
    depends_on:
      phoenix:
        condition: service_healthy
    stdin_open: true
    tty: true

  agent-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - agent-api

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6060:6006"  # Phoenix UI / OTLP HTTP endpoint
      - "4317:4317"  # OTLP gRPC endpoint
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
