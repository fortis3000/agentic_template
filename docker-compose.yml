services:
  agent-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: agentic-template:latest
    volumes:
      - .:/app
    environment:
      - PHOENIX_CLIENT_HEADERS=api_key=${PHOENIX_API_KEY:-}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
    env_file:
      - .env
    depends_on:
      - phoenix
    stdin_open: true
    tty: true

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6060:6060" # Phoenix UI
      - "6006:6006" # OTLP HTTP endpoint
      - "4317:4317" # OTLP gRPC endpoint
