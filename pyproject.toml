[project]
name = "agentic_template"
version = "0.0.1"
description = "Agentic project template"
authors = [
  {name = "Mikhail S.", email = "fortis3000@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-json-logger==2.0.7",
    "google-antigravity",
    "pydantic-ai",
    "arize-phoenix",
    "google-api-python-client>=2.197.0",
    "google-auth>=2.55.0",
    "pyyaml",
    "nest-asyncio",
    "pillow>=10.0.0",
    # NOTE: PyMuPDF is licensed under AGPL-3.0. See https://pymupdf.readthedocs.io/en/latest/about.html#license
    "pymupdf>=1.24.0",
    "qdrant-client>=1.18.0",
]

[project.optional-dependencies]
lint = [
    "ruff==0.14.2",
    "bandit>=1.8.0",
    "pymarkdownlnt>=0.9.0",
    "ty",
    "pre-commit",
    "sqlfluff",
    "yamllint",
    "semgrep",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "mutmut>=3.6.0",
]
dev = [
    "jupyter",
]
all = [
    "agentic_template[lint,test,dev]",
]

[tool.uv]
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
google-auth = false
google-api-python-client = false

[tool.ruff]
# Formatting
line-length = 100
exclude = [".pytest_cache", "**/__pycache__/", "**/*.ipynb_checkpoints/", "*.ipynb"]
# Linting
lint.extend-select = ["F", "I", "PL", "N"]
lint.extend-ignore = ["D", "E501", "PLR0913", "E402", "C403","F405", "E203","E731", "E712"]

[tool.ruff.lint.isort]
case-sensitive = true

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.sqlfluff.core]
dialect = "ansi"
templater = "jinja"

[tool.mutmut]
source_paths = [
    "src/utils/retry.py",
    "src/utils/pr_validator.py",
    "src/tools/text_extractor.py",
]
also_copy = [
    "src/",
    ".github/",
]
pytest_add_cli_args_test_selection = [
    "tests/test_retry.py",
    "tests/test_pr_validator.py",
    "tests/test_text_extractor.py",
]
pytest_add_cli_args = [
    "-p", "no:cov",
    "-p", "no:logfire",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = ["mutants", ".git", ".venv", ".pytest_cache", ".ruff_cache", "frontend", ".worktrees"]

[tool.pyright]
extraPaths = ["src"]

[tool.ty.environment]
extra-paths = ["src"]







